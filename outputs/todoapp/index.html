<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TaskFlow Todo</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app-shell">
      <section class="sidebar" aria-label="Task summary and filters">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">✓</span>
          <div>
            <h1>TaskFlow</h1>
            <p id="todayLabel"></p>
          </div>
        </div>

        <div class="stats-grid" aria-label="Task statistics">
          <div class="stat">
            <span id="totalCount">0</span>
            <small>Total</small>
          </div>
          <div class="stat">
            <span id="openCount">0</span>
            <small>Open</small>
          </div>
          <div class="stat">
            <span id="doneCount">0</span>
            <small>Done</small>
          </div>
          <div class="stat">
            <span id="dueCount">0</span>
            <small>Due</small>
          </div>
        </div>

        <nav class="filter-list" aria-label="Task filters">
          <button class="filter-button is-active" data-filter="all" type="button">
            <span>All tasks</span>
            <strong id="allBadge">0</strong>
          </button>
          <button class="filter-button" data-filter="pending" type="button">
            <span>Pending</span>
            <strong id="pendingBadge">0</strong>
          </button>
          <button class="filter-button" data-filter="completed" type="button">
            <span>Completed</span>
            <strong id="completedBadge">0</strong>
          </button>
          <button class="filter-button" data-filter="today" type="button">
            <span>Due today</span>
            <strong id="todayBadge">0</strong>
          </button>
          <button class="filter-button" data-filter="overdue" type="button">
            <span>Overdue</span>
            <strong id="overdueBadge">0</strong>
          </button>
        </nav>
      </section>

      <section class="workspace" aria-label="Task manager">
        <div class="topbar">
          <div>
            <p class="eyebrow">Task management system</p>
            <h2>Plan, prioritize, finish.</h2>
          </div>
          <div class="search-wrap">
            <span aria-hidden="true">⌕</span>
            <input id="searchInput" type="search" placeholder="Search tasks" />
          </div>
        </div>

        <section class="task-composer" aria-label="Create or update a task">
          <form id="taskForm">
            <input type="hidden" id="taskId" />
            <div class="form-main">
              <label>
                <span>Task</span>
                <input id="titleInput" type="text" maxlength="90" placeholder="Add a task" required />
              </label>
              <label>
                <span>Details</span>
                <textarea id="notesInput" rows="3" maxlength="260" placeholder="Optional notes"></textarea>
              </label>
            </div>
            <div class="form-grid">
              <label>
                <span>Due date</span>
                <input id="dueInput" type="date" />
              </label>
              <label>
                <span>Priority</span>
                <select id="priorityInput">
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </label>
              <label>
                <span>List</span>
                <input id="categoryInput" type="text" maxlength="30" placeholder="Personal" />
              </label>
            </div>
            <div class="form-actions">
              <button class="ghost-button" id="cancelEditButton" type="button" hidden>Cancel</button>
              <button class="primary-button" id="submitButton" type="submit">Add task</button>
            </div>
          </form>
        </section>

        <div class="task-toolbar">
          <div class="view-tabs" role="tablist" aria-label="Sort tasks">
            <button class="tab-button is-active" data-sort="createdAt" type="button">Newest</button>
            <button class="tab-button" data-sort="dueDate" type="button">Due date</button>
            <button class="tab-button" data-sort="priority" type="button">Priority</button>
          </div>
          <button class="danger-button" id="clearCompletedButton" type="button">Clear done</button>
        </div>

        <div id="taskList" class="task-list" aria-live="polite"></div>
        <div id="emptyState" class="empty-state" hidden>
          <div aria-hidden="true">□</div>
          <h3>No tasks found</h3>
          <p>Create a task or adjust the current filter.</p>
        </div>
      </section>
    </main>

    <template id="taskTemplate">
      <article class="task-item">
        <button class="status-toggle" type="button" aria-label="Toggle task status"></button>
        <div class="task-content">
          <div class="task-heading">
            <h3></h3>
            <span class="priority-pill"></span>
          </div>
          <p class="task-notes"></p>
          <div class="task-meta">
            <span class="due-meta"></span>
            <span class="category-meta"></span>
          </div>
        </div>
        <div class="task-actions">
          <button class="icon-button edit-button" type="button" aria-label="Edit task" title="Edit">✎</button>
          <button class="icon-button delete-button" type="button" aria-label="Delete task" title="Delete">×</button>
        </div>
      </article>
    </template>

    <script src="app.js"></script>
  </body>
</html>
