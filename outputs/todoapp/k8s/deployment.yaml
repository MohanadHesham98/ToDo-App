apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskflow-todo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskflow-todo
  template:
    metadata:
      labels:
        app: taskflow-todo
    spec:
      containers:
        - name: taskflow-todo
          image: mohanad898/taskflow-todo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            # Configure non-secret runtime values here or move them into a ConfigMap.
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"
            - name: HOST
              value: 0.0.0.0
            - name: SQL_SERVER
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: SQL_SERVER
            - name: SQL_PORT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: SQL_PORT
            - name: SQL_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: SQL_DATABASE
            - name: SQL_ENCRYPT
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: SQL_ENCRYPT
            - name: SQL_TRUST_SERVER_CERTIFICATE
              valueFrom:
                configMapKeyRef:
                  name: taskflow-config
                  key: SQL_TRUST_SERVER_CERTIFICATE
            - name: SQL_USER
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: SQL_USER
            - name: SQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: taskflow-secrets
                  key: SQL_PASSWORD
          readinessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20
